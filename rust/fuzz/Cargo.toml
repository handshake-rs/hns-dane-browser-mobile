[package]
name = "hns-dane-browser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
hns-core = { package = "hns-browser-primitives", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "0346c25973d5c91de94d49b47349ec9b9efce3a0" }
hns-dane = { package = "hns-browser-dane", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "0346c25973d5c91de94d49b47349ec9b9efce3a0" }
hns-p2p = { package = "hns-browser-p2p", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "0346c25973d5c91de94d49b47349ec9b9efce3a0" }
hns-urkel = { package = "hns-browser-urkel", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "0346c25973d5c91de94d49b47349ec9b9efce3a0" }
libfuzzer-sys = "0.4"

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hns_resource"
path = "fuzz_targets/hns_resource.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_frame"
path = "fuzz_targets/p2p_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "urkel_proof"
path = "fuzz_targets/urkel_proof.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tlsa_record"
path = "fuzz_targets/tlsa_record.rs"
test = false
doc = false
bench = false
