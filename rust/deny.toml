[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# `paste` is an unmaintained proc-macro dependency of both maintained
# reachability dependencies: getifs 0.6.1 and portmapper 0.19.3/netwatch. The
# advisory declares no vulnerability and offers no compatible safe upgrade.
# Keep this exception exact so every vulnerability and every other
# unmaintained dependency remains denied.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["MITNFA"], name = "hex_lit", version = "0.1.1" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
