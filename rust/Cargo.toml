[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/android-ffi",
    "crates/hns-mobile-platform-runtime",
    "crates/ios-ffi",
    "vendor/hns-light-p2p",
]

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.92"
publish = false

[workspace.dependencies]
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
hex = "0.4"
getrandom = "0.3"
hns-header-consensus = { version = "=0.3.0", git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-light-sync = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "4a6dc2c8402f3593483d2e554347a3694b811f5e" }
hns-cache = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-chain = { package = "hns-browser-chain", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-core = { package = "hns-browser-primitives", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-dane = { package = "hns-browser-dane", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-dnssec = { package = "hns-browser-dnssec", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-gateway = { package = "hns-browser-gateway", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f", default-features = false, features = ["mobile"] }
hns-browser-observability = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-browser-runtime = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-icann-dane = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-loopback-proxy = { package = "hns-browser-loopback-proxy", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f", default-features = false, features = ["mobile"] }
hns-wallet-ffi = { version = "=0.1.0", git = "https://github.com/handshake-rs/hns-wallet-rs.git", rev = "029e8f38a9e91a8efff6d92e9452a6d46386699c" }
hns-wallet-mobile = { version = "=0.1.0", git = "https://github.com/handshake-rs/hns-wallet-rs.git", rev = "029e8f38a9e91a8efff6d92e9452a6d46386699c" }
hns-wallet-types = { version = "=0.1.0", git = "https://github.com/handshake-rs/hns-wallet-rs.git", rev = "029e8f38a9e91a8efff6d92e9452a6d46386699c" }
hns-mobile-platform-runtime = { path = "crates/hns-mobile-platform-runtime" }
hns-namespace-resolution = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-resolution-policy = { version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hns-p2p = { package = "hns-browser-p2p", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-resolver = { package = "hns-browser-resolver", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-sync = { package = "hns-browser-sync", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
hns-transport = { package = "hns-browser-transport", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f", default-features = false, features = ["mobile"] }
hns-urkel = { package = "hns-browser-urkel", version = "=0.2.1", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "37c9b509e6c9e001cfa738ac21f4d2ae403a703f" }
http = "1"
httparse = "1.10"
idna = "1.1"
jni = "0.21"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring"] }
ring = "0.17.14"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"
zeroize = "1.8"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
panic = "abort"

# FFI exports contain explicit panic boundaries. Apple release artifacts keep
# unwinding enabled so a panic can be translated into a fail-closed ABI result
# instead of crossing the C boundary or aborting the host application.
[profile.ios-release]
inherits = "release"
panic = "unwind"

# The direct wallet and the browser light runtime meet at canonical HNS
# headers, blocks, and wire messages. The light engine declares the published
# 0.3 protocol line; pin that registry line to the same reviewed hns-rs source
# used by hns-wallet-rs so Cargo cannot construct incompatible duplicate types.
[patch.crates-io]
hns-covenants = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-encoding = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-header-consensus = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-p2p-wire = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-primitives = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-transaction = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }
hns-urkel-proof = { git = "https://github.com/handshake-rs/hns-rs.git", rev = "42b0efe14e2a54d4a4a8e0c8633e021c2531a3e8" }

# HSD peers commonly transmit `verack` before `version`. Keep the direct
# wallet's bounded light-client session interoperable with that valid ordering
# until the upstream hns-light-p2p release includes the same fix.
[patch."https://github.com/handshake-rs/hns-dane-engine.git"]
hns-light-p2p = { path = "vendor/hns-light-p2p" }
