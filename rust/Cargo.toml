[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/android-ffi",
    "crates/hns-dane",
    "crates/hns-dnssec",
    "crates/hns-gateway",
    "crates/hns-loopback-proxy",
    "crates/hns-mobile-platform-runtime",
    "crates/ios-ffi",
    "crates/hns-resolver",
    "crates/hns-sync",
    "crates/hns-transport",
]

[workspace.package]
edition = "2024"
version = "0.5.6"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.92"
publish = false

[workspace.dependencies]
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
hex = "0.4"
getrandom = "0.3"
hns-cache = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "d8b564fe1aaf88c32f7bbfeb4a3a5306bbc7780f" }
hns-chain = { package = "hns-browser-chain", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "85f7dc406828786cecf9f1a8f651261dcc41138f" }
hns-core = { package = "hns-browser-primitives", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "85f7dc406828786cecf9f1a8f651261dcc41138f" }
hns-dane = { path = "crates/hns-dane" }
hns-dnssec = { path = "crates/hns-dnssec" }
hns-gateway = { path = "crates/hns-gateway" }
hns-browser-observability = "=0.1.2"
hns-browser-runtime = "=0.1.0"
hns-icann-dane = "=0.1.0"
hns-loopback-proxy = { path = "crates/hns-loopback-proxy" }
hns-mobile-platform-runtime = { path = "crates/hns-mobile-platform-runtime" }
hns-namespace-resolution = "=0.1.0"
hns-resolution-policy = "=0.1.0"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hns-p2p = { package = "hns-browser-p2p", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "85f7dc406828786cecf9f1a8f651261dcc41138f" }
hns-resolver = { path = "crates/hns-resolver" }
hns-sync = { path = "crates/hns-sync" }
hns-transport = { path = "crates/hns-transport" }
hns-urkel = { package = "hns-browser-urkel", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "85f7dc406828786cecf9f1a8f651261dcc41138f" }
http = "1"
httparse = "1.10"
idna = "1.1"
jni = "0.21"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring"] }
ring = "0.17.14"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"
zeroize = "1.8"

# Temporary 0.1 compatibility bridge while platform adapters move to the
# engine 0.2 API. Pin every shared crate to one engine commit so Rust type
# identities cannot split between registry and Git sources.
[patch.crates-io]
hns-browser-observability = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "1ab4ab626f945712b0f960945986cb52efefef7c" }
hns-browser-runtime = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "1ab4ab626f945712b0f960945986cb52efefef7c" }
hns-icann-dane = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "1ab4ab626f945712b0f960945986cb52efefef7c" }
hns-namespace-resolution = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "1ab4ab626f945712b0f960945986cb52efefef7c" }
hns-resolution-policy = { git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "1ab4ab626f945712b0f960945986cb52efefef7c" }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
panic = "abort"

# FFI exports contain explicit panic boundaries. Apple release artifacts keep
# unwinding enabled so a panic can be translated into a fail-closed ABI result
# instead of crossing the C boundary or aborting the host application.
[profile.ios-release]
inherits = "release"
panic = "unwind"
