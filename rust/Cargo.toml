[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/android-ffi",
    "crates/hns-mobile-platform-runtime",
    "crates/ios-ffi",
]

[workspace.package]
edition = "2024"
version = "0.5.9"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.92"
publish = false

[workspace.dependencies]
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
hex = "0.4"
getrandom = "0.3"
hns-cache = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-chain = { package = "hns-browser-chain", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-core = { package = "hns-browser-primitives", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-dane = { package = "hns-browser-dane", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-dnssec = { package = "hns-browser-dnssec", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-gateway = { package = "hns-browser-gateway", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7", default-features = false, features = ["mobile"] }
hns-browser-observability = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-browser-runtime = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-icann-dane = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-loopback-proxy = { package = "hns-browser-loopback-proxy", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7", default-features = false, features = ["mobile"] }
hns-wallet-mobile = { version = "=0.1.0", git = "https://github.com/handshake-rs/hns-wallet-rs.git", rev = "2229be849557d58a8eb723bcc03349f0f2df9796" }
hns-mobile-platform-runtime = { path = "crates/hns-mobile-platform-runtime" }
hns-namespace-resolution = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-resolution-policy = { version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hns-p2p = { package = "hns-browser-p2p", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-resolver = { package = "hns-browser-resolver", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-sync = { package = "hns-browser-sync", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
hns-transport = { package = "hns-browser-transport", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7", default-features = false, features = ["mobile"] }
hns-urkel = { package = "hns-browser-urkel", version = "=0.2.0", git = "https://github.com/handshake-rs/hns-dane-engine.git", rev = "2b23bd55d14d36fe60073606869d75b4796c54f7" }
http = "1"
httparse = "1.10"
idna = "1.1"
jni = "0.21"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.8", default-features = false, features = ["ring"] }
ring = "0.17.14"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"
zeroize = "1.8"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
panic = "abort"

# FFI exports contain explicit panic boundaries. Apple release artifacts keep
# unwinding enabled so a panic can be translated into a fail-closed ABI result
# instead of crossing the C boundary or aborting the host application.
[profile.ios-release]
inherits = "release"
panic = "unwind"
