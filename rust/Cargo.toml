[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/android-ffi",
    "crates/hns-mobile-platform-runtime",
    "crates/ios-ffi",
]

[workspace.package]
edition = "2024"
version = "1.0.2"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.98"
publish = false

[workspace.dependencies]
crab_nat = "0.8.1"
getifs = "0.6.0"
hns-header-consensus = "=0.5.0"
hns-light-sync = "=0.2.6"
hns-cache = "=0.2.2"
hns-chain = { package = "hns-browser-chain", version = "=0.2.6" }
hns-core = { package = "hns-browser-primitives", version = "=0.2.2" }
hns-dane = { package = "hns-browser-dane", version = "=0.2.4" }
hns-dnssec = { package = "hns-browser-dnssec", version = "=0.2.3" }
hns-gateway = { package = "hns-browser-gateway", version = "=0.2.4", default-features = false, features = ["mobile"] }
hns-browser-observability = "=0.3.0"
hns-browser-runtime = "=0.2.2"
hns-icann-dane = "=0.2.2"
hns-loopback-proxy = { package = "hns-browser-loopback-proxy", version = "=0.2.4", default-features = false, features = ["mobile"] }
# Pin the published peer, market, and restart-safe Bitcoin wallet releases.
# Compatible transitive ranges select the reviewed transport and Kyoto patches.
hns-wallet-ffi = "=0.4.1"
hns-wallet-mobile = "=0.6.2"
hns-wallet-types = "=0.4.1"
hns-wallet-hns = "=0.4.5"
hns-mobile-platform-runtime = { path = "crates/hns-mobile-platform-runtime" }
hns-namespace-resolution = "=0.2.3"
hns-resolution-policy = "=0.3.0"
hns-p2p = { package = "hns-browser-p2p", version = "=0.2.6" }
hns-resolver = { package = "hns-browser-resolver", version = "=0.2.7" }
hns-sync = { package = "hns-browser-sync", version = "=0.2.2" }
hns-transport = { package = "hns-browser-transport", version = "=0.2.4", default-features = false, features = ["mobile"] }
hns-urkel = { package = "hns-browser-urkel", version = "=0.2.2" }
httparse = "1.10"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
jni = "0.21"
portmapper = "0.19.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
panic = "abort"

# FFI exports contain explicit panic boundaries. Apple release artifacts keep
# unwinding enabled so a panic can be translated into a fail-closed ABI result
# instead of crossing the C boundary or aborting the host application.
[profile.ios-release]
inherits = "release"
panic = "unwind"
