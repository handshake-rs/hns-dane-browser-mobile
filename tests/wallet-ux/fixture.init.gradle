// Explicitly opt in with --init-script; production and preview IDs stay intact.
allprojects {
    afterEvaluate { project ->
        if (project.path == ':app') {
            project.android.defaultConfig.applicationId = 'com.denuoweb.hnsdane.walletuxfixture'
            project.android.defaultConfig.testApplicationId = 'com.denuoweb.hnsdane.walletuxfixture.test'
            project.android.buildTypes.debug.applicationIdSuffix = ''
            project.android.sourceSets.debug.manifest.srcFile(
                new File(project.rootDir, '../tests/wallet-ux/AndroidManifest.xml')
            )
        }
    }
}
