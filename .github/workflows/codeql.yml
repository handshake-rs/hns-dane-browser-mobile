name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: c-cpp
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: python
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: rust
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-24.04
            timeout: 45
          - language: swift
            build-mode: manual
            runner: macos-26
            timeout: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 for Kotlin analysis
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components for Kotlin analysis
        if: ${{ matrix.language == 'java-kotlin' }}
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Install pinned Rust toolchain for Swift analysis
        if: ${{ matrix.language == 'swift' }}
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup target add --toolchain 1.92.0 \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      # The Xcode project links this generated framework. Build it before
      # initializing CodeQL so only the Swift application build is traced.
      - name: Prepare Rust XCFramework for Swift analysis
        if: ${{ matrix.language == 'swift' }}
        run: ./scripts/build-rust-ios.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Kotlin compilation does not load or package the Rust JNI library. The
      # native task is covered independently by Rust analysis and the main CI.
      - name: Compile Kotlin manually
        if: ${{ matrix.language == 'java-kotlin' }}
        working-directory: android
        run: >-
          ./gradlew :app:compileDebugKotlin
          -x :app:buildRustAndroid
          --no-daemon
          --stacktrace

      - name: Build Swift manually
        if: ${{ matrix.language == 'swift' }}
        env:
          HNS_IOS_ACTION: build
          HNS_IOS_DESTINATION: generic/platform=iOS Simulator
          HNS_IOS_REUSE_XCFRAMEWORK: "1"
        run: ./scripts/build-ios.sh

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
