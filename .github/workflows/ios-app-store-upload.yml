name: iOS App Store Upload

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact lowercase 40-character main-branch commit to upload
        required: true
        type: string
      confirm_upload:
        description: Upload the current main-branch iOS build to App Store Connect
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sha-${{ inputs.expected_commit }}-ios-app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Validate, sign, and upload
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_upload }}
    concurrency:
      group: global-ios-app-store-upload-lease
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 180
    environment: app-store
    steps:
      - name: Validate the exact main-branch upload request
        env:
          DISPATCH_COMMIT: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "expected_commit must be one lowercase 40-character Git SHA" >&2
            exit 2
          fi
          [[ "$DISPATCH_REF" == refs/heads/main ]] || {
            echo "The upload workflow must be dispatched from main." >&2
            exit 2
          }
          [[ "$DISPATCH_COMMIT" == "$EXPECTED_COMMIT" ]] || {
            echo "expected_commit must equal the main commit selected at dispatch." >&2
            exit 2
          }

      - name: Check out the exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Read back the exact reviewed commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Run the complete unsigned iOS gate
        id: ios_gate
        run: ./scripts/run-ios-gate.sh

      - name: Upload failed unsigned iOS gate diagnostics
        if: failure() && steps.ios_gate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-gate-diagnostics-${{ inputs.expected_commit }}-attempt-${{ github.run_attempt }}
          path: build/ios-gate-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Capture mandatory live Release App Store screenshots
        id: live_capture
        run: ./scripts/generate-ios-app-store-screenshots.sh

      - name: Upload failed live-capture diagnostics
        if: failure() && steps.live_capture.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-store-screenshot-diagnostics-${{ inputs.expected_commit }}
          path: build/ios-screenshot-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Verify mandatory screenshots against the exact upload commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 scripts/ios_screenshot_tools.py verify-live \
            --directory build/app-store-live-screenshots \
            --expected-commit "$EXPECTED_COMMIT"

      - name: Retain mandatory screenshots and provenance for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-store-live-screenshots-${{ inputs.expected_commit }}
          path: |
            build/app-store-live-screenshots/*.jpg
            build/app-store-live-screenshots/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Recheck current main before using upload credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if ! printf '%s\n' "$current_main" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve one exact current main commit." >&2
            exit 1
          fi
          [[ "$current_main" == "$EXPECTED_COMMIT" ]] || {
            echo "main moved after dispatch; review and qualify the new commit before uploading." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Materialize temporary signing credentials
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ -n "$API_PRIVATE_KEY" ]]
          [[ -n "$DISTRIBUTION_P12_BASE64" ]]
          [[ -n "$APP_STORE_PROFILE_BASE64" ]]
          key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          p12_path="$RUNNER_TEMP/hns-dane-browser-apple-distribution.p12"
          profile_path="$RUNNER_TEMP/hns-dane-browser-app-store.mobileprovision"
          cleanup_materialization() {
            rm -f -- "$key_path" "$p12_path" "$profile_path"
          }
          trap cleanup_materialization ERR
          umask 077
          printf '%s' "$API_PRIVATE_KEY" >"$key_path"
          printf '%s' "$DISTRIBUTION_P12_BASE64" | base64 -D >"$p12_path"
          printf '%s' "$APP_STORE_PROFILE_BASE64" | base64 -D >"$profile_path"
          [[ -s "$key_path" && -s "$p12_path" && -s "$profile_path" ]]
          trap - ERR
          printf 'HNS_ASC_API_KEY_PATH=%s\n' "$key_path" >>"$GITHUB_ENV"
          printf 'HNS_IOS_DISTRIBUTION_P12_PATH=%s\n' "$p12_path" >>"$GITHUB_ENV"
          printf 'HNS_IOS_APP_STORE_PROFILE_PATH=%s\n' "$profile_path" >>"$GITHUB_ENV"

      - name: Create the signed archive and upload it
        env:
          HNS_IOS_TEAM_ID: 45NQQK3G3S
          HNS_ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          HNS_ASC_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          HNS_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          HNS_IOS_IPA_OUTPUT_PATH: ${{ runner.temp }}/hns-dane-browser-ios-app-store.ipa
          HNS_RELEASE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: ./scripts/upload-ios-app-store.sh

      - name: Record signed IPA provenance
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          IPA_PATH: ${{ runner.temp }}/hns-dane-browser-ios-app-store.ipa
          PROVENANCE_PATH: ${{ runner.temp }}/hns-dane-browser-ios-app-store.provenance.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 - "$IPA_PATH" "$PROVENANCE_PATH" "$EXPECTED_COMMIT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          ipa_path = Path(sys.argv[1])
          provenance_path = Path(sys.argv[2])
          expected_commit = sys.argv[3]
          if not ipa_path.is_file() or ipa_path.stat().st_size <= 0:
              raise SystemExit(f"signed IPA is missing or empty: {ipa_path}")
          digest = hashlib.sha256()
          with ipa_path.open("rb") as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(block)
          provenance_path.write_text(
              json.dumps(
                  {
                      "artifact": ipa_path.name,
                      "sha256": digest.hexdigest(),
                      "size": ipa_path.stat().st_size,
                      "sourceCommit": expected_commit,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain the signed App Store IPA for release publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app-store-ipa-${{ inputs.expected_commit }}
          path: |
            ${{ runner.temp }}/hns-dane-browser-ios-app-store.ipa
            ${{ runner.temp }}/hns-dane-browser-ios-app-store.provenance.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove the temporary signing credentials
        if: ${{ always() }}
        run: |
          for credential_path in \
            "${HNS_ASC_API_KEY_PATH:-}" \
            "${HNS_IOS_DISTRIBUTION_P12_PATH:-}" \
            "${HNS_IOS_APP_STORE_PROFILE_PATH:-}"; do
            if [[ -n "$credential_path" ]]; then
              rm -f -- "$credential_path"
            fi
          done
